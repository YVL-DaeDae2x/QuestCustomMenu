<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Custom Menu</title>

<style>
* { box-sizing: border-box; }

body {
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 18px;
}

.menu {
  max-width: 550px;
  margin: auto;
}

h1 {
  color: #00eaff;
  text-align: center;
  text-shadow: 0 0 15px #00eaff;
}

.subtitle {
  text-align: center;
  color: #8996a8;
}

.section {
  background: #141c29;
  border: 1px solid #164e62;
  border-radius: 14px;
  padding: 15px;
  margin: 12px 0;
}

.section h2 {
  color: #00eaff;
  font-size: 19px;
}

.feature {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #293747;
}

button {
  background: #003d50;
  color: white;
  border: 1px solid #00eaff;
  border-radius: 9px;
  padding: 12px;
  font-size: 15px;
}

input {
  background: #080b12;
  color: white;
  border: 1px solid #00eaff;
  padding: 12px;
  border-radius: 8px;
  max-width: 100%;
}

input[type=checkbox] {
  accent-color: #00eaff;
  width: 22px;
  height: 22px;
}

#status {
  color: #00eaff;
  text-align: center;
}

</style>
</head>

<body>
<div class="menu">

<h1>QUEST CUSTOM MENU</h1>
<p class="subtitle">YOUR PERSONAL GAMING CONTROL CENTER</p>

<p id="status">SYSTEM READY</p>

<div class="section">
<h2>🏠 Home</h2>
<p>Welcome to your custom Quest menu.</p>
<p>Customize your features below.</p>
</div>

<div class="section">
<h2>⚡ Movement</h2>
<div id="movement"></div>
</div>

<div class="section">
<h2>🚀 Speed</h2>
<div id="speed"></div>
</div>

<div class="section">
<h2>🕊️ Fly</h2>
<div id="fly"></div>
</div>

<div class="section">
<h2>🔊 Soundboard</h2>
<div id="soundboard"></div>
</div>

<div class="section">
<h2>🎙️ Voice Changer</h2>
<div id="voice"></div>
</div>

<div class="section">
<h2>🛠️ Custom Features</h2>

<input id="featureName"
placeholder="Enter feature name">

<button onclick="addFeature()">
+ Add Feature
</button>

<div id="custom"></div>
</div>

<div class="section">
<h2>⚙️ Settings</h2>
<button onclick="resetMenu()">Reset Menu</button>
</div>

</div>

<script>
const groups = {
 movement: ["Movement Toggle"],
 speed: ["Speed Setting"],
 fly: ["Flight Setting"],
 soundboard: ["Sound Effect"],
 voice: ["Voice Effect"]
};

function createFeature(name, container) {
 let row = document.createElement("div");
 row.className = "feature";

 let label = document.createElement("span");
 label.textContent = name;

 let toggle = document.createElement("input");
 toggle.type = "checkbox";

 toggle.onchange = () => {
   document.getElementById("status").textContent =
     name + (toggle.checked ? " ON" : " OFF");
   saveMenu();
 };

 row.append(label, toggle);
 container.appendChild(row);
}

function loadMenu() {
 Object.keys(groups).forEach(group => {
   let container = document.getElementById(group);
   groups[group].forEach(name =>
     createFeature(name, container)
   );
 });

 let saved = JSON.parse(
   localStorage.getItem("questFeatures") || "[]"
 );

 saved.forEach(name =>
   createFeature(name, document.getElementById("custom"))
 );
}

function addFeature() {
 let input = document.getElementById("featureName");
 let name = input.value.trim();

 if (!name) return;

 createFeature(name, document.getElementById("custom"));

 let saved = JSON.parse(
   localStorage.getItem("questFeatures") || "[]"
 );

 saved.push(name);
 localStorage.setItem("questFeatures", JSON.stringify(saved));

 input.value = "";
 document.getElementById("status").textContent =
   name + " ADDED";
}

function saveMenu() {
 document.getElementById("status").textContent =
   "SETTINGS UPDATED";
}

function resetMenu() {
 localStorage.removeItem("questFeatures");
 location.reload();
}

loadMenu();
</script>

</body>
</html>
