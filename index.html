<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON QUEST</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: transparent;
  color: #00ffff;
  font-family: Arial, sans-serif;
}

#menu {
  position: absolute;
  top: 60px;
  left: 40px;
  width: 300px;
  border: 2px solid #00ffff;
  border-radius: 16px;
  background: rgba(0, 10, 20, .82);
  box-shadow: 0 0 18px #00ffff;
  overflow: hidden;
}

header {
  padding: 16px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  text-shadow: 0 0 12px #00ffff;
  cursor: move;
  border-bottom: 1px solid #00ffff;
}

nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding: 10px;
}

button {
  background: rgba(0, 255, 255, .08);
  border: 1px solid #00ffff;
  color: #00ffff;
  border-radius: 8px;
  padding: 11px 5px;
  cursor: pointer;
  font-weight: bold;
}

button:active,
button.active {
  background: #00ffff;
  color: #001018;
  box-shadow: 0 0 12px #00ffff;
}

#content {
  padding: 15px;
  min-height: 160px;
}

h3 {
  margin-top: 0;
  text-shadow: 0 0 8px #00ffff;
}

.option {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
}

input[type="range"] {
  width: 100%;
  accent-color: #00ffff;
}

#close {
  margin: 0 10px 12px;
  width: calc(100% - 20px);
}
</style>
</head>

<body>

<div id="menu">
  <header id="drag">⚡ NEON QUEST ⚡</header>

  <nav>
    <button onclick="showTab('Movement',this)">Movement</button>
    <button onclick="showTab('Speed',this)">Speed</button>
    <button onclick="showTab('Fly',this)">Fly</button>
    <button onclick="showTab('Soundboard',this)">Soundboard</button>
    <button onclick="showTab('Voice Changer',this)">Voice Changer</button>
    <button onclick="showTab('Settings',this)">Settings</button>
  </nav>

  <section id="content">
    <h3>Welcome!</h3>
    Select a tab to get started.
  </section>

  <button id="close" onclick="toggleMenu()">CLOSE MENU</button>
</div>

<script>
const content = document.getElementById("content");

function showTab(name, button) {
  document.querySelectorAll("nav button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  const pages = {
    "Movement": `
      <h3>Movement</h3>
      <div class="option">Movement menu <input type="checkbox"></div>
      <p>Movement controls are interface options only.</p>
    `,
    "Speed": `
      <h3>Speed</h3>
      <p>Speed setting: <span id="speedValue">1x</span></p>
      <input type="range" min="1" max="10" value="1"
      oninput="document.getElementById('speedValue').textContent=this.value+'x'">
    `,
    "Fly": `
      <h3>Fly</h3>
      <div class="option">Fly toggle <input type="checkbox"></div>
      <p>Does not change in-game movement.</p>
    `,
    "Soundboard": `
      <h3>Soundboard</h3>
      <button onclick="beep()">Play Beep</button>
      <button onclick="stopSound()">Stop</button>
    `,
    "Voice Changer": `
      <h3>Voice Changer</h3>
      <p>Voice effects are not connected to Horizon voice chat.</p>
    `,
    "Settings": `
      <h3>Settings</h3>
      <div class="option">Glow <input type="checkbox" checked></div>
      <button onclick="toggleMenu()">Close Menu</button>
    `
  };

  content.innerHTML = pages[name];
}

let audio;

function beep() {
  audio = new AudioContext();
  const oscillator = audio.createOscillator();
  oscillator.connect(audio.destination);
  oscillator.frequency.value = 700;
  oscillator.start();
  oscillator.stop(audio.currentTime + .3);
}

function stopSound() {
  if (audio) audio.close();
}

function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display =
    menu.style.display === "none" ? "block" : "none";
}

const menu = document.getElementById("menu");
const drag = document.getElementById("drag");

let moving = false, offsetX = 0, offsetY = 0;

drag.addEventListener("pointerdown", e => {
  moving = true;
  offsetX = e.clientX - menu.offsetLeft;
  offsetY = e.clientY - menu.offsetTop;
  drag.setPointerCapture(e.pointerId);
});

drag.addEventListener("pointermove", e => {
  if (!moving) return;
  menu.style.left = (e.clientX - offsetX) + "px";
  menu.style.top = (e.clientY - offsetY) + "px";
});

drag.addEventListener("pointerup", () => moving = false);
</script>

</body>
</html>
